<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101214"><title>Заявки · Могучка</title><style>:root{color-scheme:dark;--bg:#101214;--panel:#171a1d;--line:rgba(255,255,255,.12);--text:#f5f1e8;--muted:#aeb3b6;--accent:#f26b21;--accent2:#ff9a54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Arial,Helvetica,sans-serif}a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}.topline{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--accent);color:#101214;transform:skew(-10deg);font-size:20px}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);font-weight:700;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#15110d}.main{padding:42px 0 80px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h1{font-size:clamp(34px,6vw,64px);line-height:.95;letter-spacing:-.06em;margin:9px 0 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.filter{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:10px 14px;cursor:pointer}.filter.active{border-color:var(--accent);color:var(--text);background:rgba(242,107,33,.12)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:15px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}tbody tr:last-child td{border-bottom:0}.phone{color:var(--accent2);font-weight:700}.status{border:1px solid var(--line);border-radius:9px;background:#101214;color:var(--text);padding:8px}.empty,.error{padding:32px;text-align:center;color:var(--muted)}.error{color:#ffd1bd}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;background:var(--accent);color:#15110d;padding:12px 18px;border-radius:999px;font-weight:700;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){table{min-width:0}thead{display:none}tbody,tr,td{display:block}tr{padding:16px;border-bottom:1px solid var(--line)}td{padding:5px 0;border:0}td:nth-child(1){color:var(--muted);font-size:13px}td:nth-child(3){color:var(--accent2)}.table-wrap{overflow:hidden}.topline,.head{align-items:flex-start;flex-direction:column}.main{padding-top:28px}.wrap{width:min(100% - 24px,1180px)}} </style></head><body><header class="top"><div class="wrap topline"><a class="brand" href="/"><span class="mark">М</span><span>МОГУЧКА / ЗАЯВКИ</span></a><a class="btn" href="/">На сайт</a></div></header><main class="main wrap"><div class="head"><div><div class="muted">Внутренняя панель</div><h1>Новые обращения</h1></div><div id="who" class="muted">Проверяем доступ…</div></div><div id="auth" class="error" hidden></div><div id="app" hidden><div class="filters"><button class="filter active" data-status="all">Все</button><button class="filter" data-status="new">Новые</button><button class="filter" data-status="contacted">Связались</button><button class="filter" data-status="done">Закрытые</button></div><div id="table" class="table-wrap"></div></div></main><div id="toast" class="toast" role="status"></div><script>const $=s=>document.querySelector(s);let rows=[],active='all';const labels={new:'Новая',contacted:'Связались',done:'Закрыта'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){try{return new Intl.DateTimeFormat('ru-RU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}function render(){const list=active==='all'?rows:rows.filter(r=>r.status===active);if(!list.length){$('#table').innerHTML='<div class="empty">Заявок пока нет.</div>';return}$('#table').innerHTML='<table><thead><tr><th>Дата</th><th>Клиент</th><th>Услуга</th><th>Описание</th><th>Статус</th></tr></thead><tbody>'+list.map(r=>'<tr><td>'+esc(date(r.created_at))+'</td><td><strong>'+esc(r.name||'Без имени')+'</strong><br><a class="phone" href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a></td><td>'+esc(r.service)+'</td><td>'+esc(r.message||'—')+'</td><td><select class="status" data-id="'+r.id+'"><option value="new" '+(r.status==='new'?'selected':'')+'>Новая</option><option value="contacted" '+(r.status==='contacted'?'selected':'')+'>Связались</option><option value="done" '+(r.status==='done'?'selected':'')+'>Закрыта</option></select></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('.status').forEach(s=>s.addEventListener('change',()=>update(s.dataset.id,s.value)))}async function load(){try{const r=await fetch('/api/bookings',{cache:'no-store'});if(r.status===401){$('#auth').hidden=false;$('#auth').innerHTML='Для просмотра заявок войдите через ChatGPT: <a class="btn primary" href="/signin-with-chatgpt?return_to=/admin">Войти</a>';$('#who').textContent='Требуется вход';return}if(!r.ok)throw new Error('server');const data=await r.json();rows=data.bookings||[];$('#app').hidden=false;$('#who').textContent='Заявок: '+rows.length;render()}catch(e){$('#auth').hidden=false;$('#auth').textContent='Не удалось загрузить заявки. Откройте админку на опубликованном сайте.';$('#who').textContent='Ошибка'}}async function update(id,status){const r=await fetch('/api/bookings/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){show('Не удалось обновить статус');return}const row=rows.find(x=>String(x.id)===String(id));if(row)row.status=status;show('Статус обновлён');render()}function show(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.status;render()}));load();</script></body></html>
